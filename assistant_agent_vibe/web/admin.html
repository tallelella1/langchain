<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atguigu 助手 · 知识管理</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #fff; --ink: #1f2328; --muted: #6b7280;
      --line: #d8d8d2; --accent: #1f6f5c; --error: #b3261e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    .sub { color: var(--muted); margin: 0 0 18px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px; margin-bottom: 14px; }
    label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    input, button { font: inherit; border: 1px solid var(--line); border-radius: 8px;
      padding: 7px 10px; background: #fff; color: inherit; }
    input { width: 100%; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px;
      background: #fbfbf9; border: 1px solid var(--line); border-radius: 8px;
      padding: 10px; max-height: 420px; overflow: auto; }
    .status { color: var(--muted); font-size: 12px; min-height: 18px; }
    .error { color: var(--error); white-space: pre-wrap; }
    ul { margin: 5px 0; padding-left: 20px; }
    code { font-size: 12px; }
  </style>
</head>
<body>
<main>
  <h1>知识管理</h1>
  <p class="sub">管理接口需要 <code>ASSISTANT_ADMIN_TOKEN</code>；令牌只保存在当前标签页的 sessionStorage。</p>

  <section class="panel">
    <label for="token">管理令牌</label>
    <div class="row">
      <input id="token" type="password" placeholder="X-Admin-Token" autocomplete="off">
      <button id="save" type="button">保存令牌</button>
    </div>
    <div class="row">
      <button id="refresh" class="primary" type="button">刷新状态</button>
      <button id="ingest" type="button">创建入库任务</button>
      <a href="/">返回问答页</a>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="error" class="error" role="alert"></div>
  </section>

  <section class="panel">
    <h2>依赖就绪</h2>
    <pre id="ready">尚未检查</pre>
  </section>

  <section class="panel">
    <h2>当前索引与文件状态</h2>
    <pre id="knowledge">尚未加载</pre>
  </section>

  <section class="panel">
    <h2>入库任务</h2>
    <pre id="tasks">尚未加载</pre>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const tokenKey = "atguigu_admin_token";
  $("token").value = sessionStorage.getItem(tokenKey) || "";

  function showError(text) { $("error").textContent = text || ""; }
  function setStatus(text) { $("status").textContent = text || ""; }
  function adminHeaders() {
    const token = $("token").value.trim();
    if (!token) throw new Error("请先填写管理令牌");
    return { "X-Admin-Token": token };
  }
  async function getJSON(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
    return data;
  }
  async function refreshReady() {
    const response = await fetch("/health/ready");
    const data = await response.json().catch(() => ({}));
    $("ready").textContent = JSON.stringify(data, null, 2);
  }
  async function refreshAdmin() {
    const headers = adminHeaders();
    const [knowledge, tasks] = await Promise.all([
      getJSON("/admin/knowledge", { headers }),
      getJSON("/admin/ingest", { headers }),
    ]);
    $("knowledge").textContent = JSON.stringify(knowledge, null, 2);
    $("tasks").textContent = JSON.stringify(tasks, null, 2);
  }
  async function refresh() {
    showError("");
    setStatus("加载中…");
    try {
      await refreshReady();
      await refreshAdmin();
      setStatus("已刷新");
    } catch (error) {
      showError(error.message || String(error));
      setStatus("刷新失败");
    }
  }
  async function startIngest() {
    showError("");
    setStatus("创建任务…");
    try {
      const task = await getJSON("/admin/ingest", {
        method: "POST",
        headers: { ...adminHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ force: false }),
      });
      setStatus(`任务已创建：${task.task_id}`);
      await refreshAdmin();
    } catch (error) {
      showError(error.message || String(error));
      setStatus("创建失败");
    }
  }
  $("save").addEventListener("click", () => {
    sessionStorage.setItem(tokenKey, $("token").value.trim());
    setStatus("令牌已保存到当前标签页");
  });
  $("refresh").addEventListener("click", refresh);
  $("ingest").addEventListener("click", startIngest);
})();
</script>
</body>
</html>
